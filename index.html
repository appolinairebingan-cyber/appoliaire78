<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNE DE MIEL - CARELLE</title>
    <style>
        /* [ARCHITECTURE CSS - CLEAN DESIGN] */
        :root {
            --bg-light: #fdf5e6;
            --bg-dark: #020205;
            --door-main: #6d4c41;
            --gold-accent: #ffd700;
            --text-dark: #fff3e0;
            --bear-size: clamp(150px, 35vh, 280px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: var(--bg-light);
            font-family: 'Montserrat', sans-serif;
            transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; perspective: 2500px;
        }

        body.is-dark { background: var(--bg-dark); }

        /* Moteur de Particules */
        #particleCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5; opacity: 0; transition: opacity 2s;
        }
        body.is-dark #particleCanvas { opacity: 1; }

        /* Scène 3D */
        .stage {
            position: relative; width: 280px; height: 380px;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; transform-style: preserve-3d;
        }

        .door-wrapper {
            position: absolute; width: 100%; height: 100%;
            transform-origin: left;
            transition: transform 1.2s cubic-bezier(0.6, -0.28, 0.735, 0.045);
            z-index: 200; cursor: pointer;
        }

        .door-face {
            width: 100%; height: 100%;
            background: linear-gradient(145deg, var(--door-main), #5d4037);
            border: 8px solid #3e2723; border-radius: 12px;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.3);
        }

        .knob {
            position: absolute; right: 25px; top: 50%;
            width: 20px; height: 20px;
            background: radial-gradient(circle, #fff, var(--gold-accent));
            border-radius: 50%;
        }

        .door-open .door-wrapper { transform: rotateY(-135deg); }

        /* Le Nounours Géant */
        .bear-entity {
            font-size: var(--bear-size); user-select: none;
            transition: all 1s ease; z-index: 10;
        }
        .is-dark .bear-entity { transform: scale(1.1); filter: drop-shadow(0 0 30px gold); }

        /* Interface Poème & Prénom */
        .ui-overlay {
            position: absolute; bottom: 12%; width: 100%;
            text-align: center; pointer-events: none; z-index: 300;
        }

        #poem-container {
            min-height: 80px; color: var(--text-dark);
            font-style: italic; font-size: 1.3rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
            margin-bottom: 15px;
        }

        .name-banner {
            display: flex; justify-content: center; gap: 8px;
            opacity: 0; transform: translateY(20px); transition: 1.5s;
        }
        .is-dark .name-banner { opacity: 1; transform: translateY(0); }

        .letter {
            font-size: clamp(35px, 12vw, 75px); font-weight: 900;
            text-transform: uppercase; animation: letterFloat 3s infinite ease-in-out;
        }

        @keyframes letterFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Couleurs Arc-en-ciel */
        .letter:nth-child(1) { color: #FF0000; animation-delay: 0.1s; }
        .letter:nth-child(2) { color: #FF7F00; animation-delay: 0.2s; }
        .letter:nth-child(3) { color: #FFFF00; animation-delay: 0.3s; }
        .letter:nth-child(4) { color: #00FF00; animation-delay: 0.4s; }
        .letter:nth-child(5) { color: #0000FF; animation-delay: 0.5s; }
        .letter:nth-child(6) { color: #4B0082; animation-delay: 0.6s; }
        .letter:nth-child(7) { color: #8B00FF; animation-delay: 0.7s; }
        .letter:nth-child(8) { color: #FF1493; animation-delay: 0.8s; }
        .letter:nth-child(9) { color: #00FFFF; animation-delay: 0.9s; }
        .letter:nth-child(10) { color: #32CD32; animation-delay: 1.0s; }

    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="christelle.mp3" type="audio/mpeg">
    </audio>

    <canvas id="particleCanvas"></canvas>

    <div class="stage" id="mainInteraction">
        <div class="door-wrapper">
            <div class="door-face"><div class="knob"></div></div>
        </div>
        <div class="bear-entity">🧸</div>
    </div>

    <div class="ui-overlay">
        <div id="poem-container"></div>
        <div class="name-banner" id="nameBanner">
  <span class="letter">D</span><span 
 class="letter">E</span><span class="letter">S</span><span  class="letter">T</span><span class="letter">I</span><span class="letter">N</span><span class="letter">É</span><span class="letter">E</span>
        </div>
    </div>

    <script>
        class LuneDeMielApp {
            constructor() {
                this.isDark = false;
                // Poème inspiré par le flow de Don Choa & Zaho
                this.poemLines = [
                    "Sur un air de Lune de Miel, le flow étincelle...",
                    "Comme un refrain de Zaho, tu es la plus belle.",
                    "Don Choa dans les baffles, l'amour est éternel...",
                    "Tout s'illumine dans le noir pour toi, DESTINÉE."
                ];
                
                this.init();
            }

            init() {
                this.body = document.body;
                this.stage = document.getElementById('mainInteraction');
                this.poemBox = document.getElementById('poem-container');
                this.music = document.getElementById('bgMusic');
                this.canvas = document.getElementById('particleCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];

                this.setupEvents();
                this.resize();
                this.render();
            }

            setupEvents() {
                this.stage.addEventListener('click', () => this.toggle());
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            toggle() {
                this.isDark = !this.isDark;
                this.body.classList.toggle('is-dark', this.isDark);
                this.stage.classList.toggle('door-open', this.isDark);
                
                if (this.isDark) {
                    this.music.play().catch(e => console.log("Audio nécessite interaction"));
                    this.startPoem();
                    this.spawnParticles();
                } else {
                    this.music.pause();
                    this.music.currentTime = 0;
                    this.poemBox.innerHTML = "";
                }
            }

            async startPoem() {
                this.poemBox.innerHTML = "";
                for (let line of this.poemLines) {
                    if (!this.isDark) break;
                    await this.typeLine(line);
                    await new Promise(r => setTimeout(r, 1800)); // Pause rythmée
                    if (this.isDark && line !== this.poemLines[3]) this.poemBox.innerHTML = "";
                }
            }

            typeLine(text) {
                return new Promise(resolve => {
                    let i = 0;
                    const speed = 50; 
                    const interval = setInterval(() => {
                        if (i < text.length && this.isDark) {
                            this.poemBox.innerHTML += text.charAt(i);
                            i++;
                        } else {
                            clearInterval(interval);
                            resolve();
                        }
                    }, speed);
                });
            }

            spawnParticles() {
                for (let i = 0; i < 80; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * -this.canvas.height,
                        s: Math.random() * 4 + 1,
                        v: Math.random() * 2 + 1,
                        c: `hsl(${Math.random() * 360}, 80%, 70%)`
                    });
                }
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                if (this.isDark) {
                    this.particles.forEach((p, i) => {
                        p.y += p.v;
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
                        this.ctx.fillStyle = p.c;
                        this.ctx.fill();
                        if (p.y > this.canvas.height) p.y = -10;
                    });
                }
                requestAnimationFrame(() => this.render());
            }
        }

        window.onload = () => new LuneDeMielApp();
        
   
    

    </script>
</body>
</html>
